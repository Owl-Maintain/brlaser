name: build
on: [ push, pull_request ]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [ clang++, gcc++ ]
    steps:
      - name: Add repository
        run: sudo apt-add-repository -y "ppa:ubuntu-toolchain-r/test"
      - name: Install packages
        run: sudo apt install libcups2-dev
      - uses: actions/checkout@v3
      - name: Configure
        run: cmake .
      - name: Make
        run: make
        env:
          CXX: ${{ matrix.compiler }}
      - name: Run tests
        run: make check
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [ clang++, gcc++ ]
    steps:
      - uses: actions/checkout@v3
      - name: Configure
        run: cmake .
      - name: Make
        run: make
        env:
          CXX: ${{ matrix.compiler }}
      - name: Run tests
        run: make check
      - name: Generate and validate PPDs
        if: matrix.compiler == 'clang++'
        run: |
          mkdir -p ppd && ppdc brlaser.drv -d ppd
          for f in ppd/*.ppd; do cupstestppd -q "$f" || { echo "cupstestppd failed: $f"; cupstestppd "$f"; exit 1; }; done
          echo "validated $(ls ppd/*.ppd | wc -l | tr -d ' ') PPDs"
      - name: Package for macOS
        if: matrix.compiler == 'clang++'
        run: |
          mkdir -p dist/brlaser-macos-$(uname -m)
          cp rastertobrlaser macos/install.sh macos/uninstall.sh macos/README.md COPYING dist/brlaser-macos-$(uname -m)/
          cp -R ppd dist/brlaser-macos-$(uname -m)/ppd
      - uses: actions/upload-artifact@v4
        if: matrix.compiler == 'clang++'
        with:
          name: brlaser-macos-${{ runner.arch }}
          path: dist/
