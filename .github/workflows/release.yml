name: release
run-name: ${{ github.actor }} is publishing release ${{ github.ref_name }}
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  sha256:
    name: sha256
    runs-on: ubuntu-latest
    steps:
    - name: Zip url
      run: echo "${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.zip"
    - name: Tarball url
      run: echo "${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
    - name: Create Source Code Checksums
      run: |
          curl -sL "${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.zip"    | shasum -a 256 | cut -d " " -f 1 >> "${{ github.ref_name }}.zip.sha256"
          curl -sL "${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz" | shasum -a 256 | cut -d " " -f 1 >> "${{ github.ref_name }}.tar.gz.sha256"
    - name: Upload Source Code Checksums
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ github.ref_name }}*
        file_glob: true
        tag: ${{ github.ref }}
        overwrite: false
  macos:
    name: macOS package
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build
        (cd build && ctest --output-on-failure)
    - name: Generate and validate PPDs
      run: |
        mkdir -p build/ppd && ppdc build/brlaser.drv -d build/ppd
        for f in build/ppd/*.ppd; do cupstestppd -q "$f" || { cupstestppd "$f"; exit 1; }; done
    - name: Package
      run: |
        D=brlaser-${{ github.ref_name }}-macos-$(uname -m)
        mkdir -p "$D"
        cp build/rastertobrlaser macos/install.sh macos/uninstall.sh macos/README.md COPYING "$D"/
        cp -R build/ppd "$D"/ppd
        codesign -s - "$D"/rastertobrlaser
        zip -qr "$D.zip" "$D"
        shasum -a 256 "$D.zip" > "$D.zip.sha256"
    - name: Upload macOS package
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: brlaser-${{ github.ref_name }}-macos-*
        file_glob: true
        tag: ${{ github.ref }}
        overwrite: false
