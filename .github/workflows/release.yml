name: release
run-name: ${{ github.actor }} is publishing release ${{ github.ref_name }}
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  sha256:
    name: sha256
    runs-on: ubuntu-latest
    steps:
    - name: Zip url
      run: echo "${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.zip"
    - name: Tarball url
      run: echo "${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
    - name: Create Source Code Checksums
      run: |
          curl -sL "${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.zip"    | shasum -a 256 | cut -d " " -f 1 >> "${{ github.ref_name }}.zip.sha256"
          curl -sL "${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz" | shasum -a 256 | cut -d " " -f 1 >> "${{ github.ref_name }}.tar.gz.sha256"
    - name: Upload Source Code Checksums
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ github.ref_name }}*
        file_glob: true
        tag: ${{ github.ref }}
        overwrite: false
  macos:
    name: macOS installer package
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build universal installer package
      # CUPS only loads filters owned by root, so a self-contained .pkg installed by
      # Installer.app is the only way to get the driver into a stock macOS system.
      run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="brlaser-${VERSION}-macos.pkg"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build
          DESTDIR="$PWD/payload" cmake --install build
          xattr -cr payload 2>/dev/null || true
          pkgbuild --root payload \
            --identifier org.brlaser.brlaser \
            --version "$VERSION" \
            --install-location / \
            "$PKG"
          lipo -info payload/Library/Printers/brlaser/Filter/rastertobrlaser
          shasum -a 256 "$PKG" | cut -d " " -f 1 > "$PKG.sha256"
    - name: Upload installer package
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: brlaser-*-macos.pkg*
        file_glob: true
        tag: ${{ github.ref }}
        overwrite: true
